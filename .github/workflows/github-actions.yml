name: GitHub Actions for Python (Django) code base
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
    branches:
      - 'check-version'

jobs:
  test-job:
    name: TestJob
    runs-on: ubuntu-latest
    steps:
      - run: >
              cat <(git diff --name-only ${{ github.base_ref }} ${{ github.head_ref }})
